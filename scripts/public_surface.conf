# public_surface.conf — the single statement of what MAY become public.
#
# Two Chronicles has one private canonical remote (`turtle`, a bare repo on the
# Mac Mini reachable only over the VPN) and one public remote (`github`). The
# question "may this path be public?" was answered independently in six places:
#
#   .gitignore                    what is tracked at all
#   scripts/public.gitignore      the public repo's own .gitignore
#   publish_public_magic.sh       ALLOWLIST_DIRS / ROOT_FILES / REGISTRY_FILES
#   publish_public_magic.sh       RSYNC_EXCLUDES
#   publish_public_magic.sh       the BLOCKED regex
#   pre-push-public-guard.sh      grep -E '^(desk|floor|box)/'
#   sanitize.sh                   the "only private paths staged" skip
#
# Six hand-maintained copies of one concept, and on 2026-08-07 they had already
# drifted: `system/config/sanitize_exceptions.txt` and
# `system/config/declared_listeners.txt` were created 2026-08-01, named in
# `.gitignore` as "sensitive — never track", and named in **none** of the
# publish-side lists. `system/` is rsync'd wholesale, so the next publish run
# would have copied both into the public worktree, staged them (`git add -A`),
# and passed the BLOCKED regex, which names only desk/floor/box/connections/
# AGENTS/mage_seal. Exposure was latent — the last publish predates the files —
# and neither carries a real name, but both are private-by-intent config that
# maps where the sensitive material lives.
#
# The repo has learned this exact lesson twice in other domains this week
# (`ops_runner.SUITE_STEPS`, `KNOWN_OFFER_KINDS`): a second hand-maintained
# copy of a list is not a safety net, it is a place for the truth to diverge.
# So the answer lives here, once, and every consumer derives from it.
#
# Grammar — one directive per line, `#` comments, blank lines ignored:
#
#   DIR  <path>    every file beneath this directory may be public
#   FILE <path>    exactly this file may be public
#   DENY <pat>     not public, even inside an allowed DIR
#
# Precedence, most specific first:  FILE  >  DENY  >  DIR
#
# An exact FILE entry is a per-path decision and beats a DENY class rule —
# that is how `desk/README.md` ships while the rest of `desk/` never does.
# The inversion risk (someone writes `FILE system/config/connections.md` and
# quietly defeats a deny) is covered by `--self-test`, which asserts a small
# absolute set is unreachable no matter what this file says.
#
# DENY matching:
#   no `/`          → basename, at any depth        (.DS_Store, AGENTS.md)
#   trailing `/`    → directory, at any depth       (archive/, .obsidian/)
#   contains `*`    → glob against the full path    (*.lock)
#   otherwise       → exact path from the repo root (system/config/connections.md)
#
# Adding a private file under an allowed DIR? Add a DENY here and nowhere else.
# Then run: ./scripts/public_surface.sh --self-test

# ─── Allowed: the framework ──────────────────────────────────────
DIR  system
DIR  library
DIR  scripts
DIR  .claude
DIR  .cursor

# ─── Allowed: public root docs ───────────────────────────────────
FILE README.md
FILE MAGIC_SPEC.md
FILE ONBOARDING.md
FILE CLAUDE.md
FILE CONTRIBUTING.md
FILE FAQ.md
FILE LICENSE
FILE ACKNOWLEDGMENTS.md
FILE TROUBLESHOOTING.md
FILE TRANSLATION_AND_INTEGRATION_GUIDE.md
FILE .gitmodules

# The templates are the public artifact; the personal files they seed are DENY.
FILE AGENTS.md.template
FILE mage_seal.md.template

# ─── Allowed: infrastructure registries (templates + readmes only) ──
FILE portals/registry.yaml.template
FILE portals/README.md
FILE circles/registry.yaml.template
FILE circles/README.md
FILE universe/README.md

# ─── Allowed: workshop scaffolding inside otherwise-private dirs ──
# A new practitioner clones the public repo and needs the shape of the
# workshop: what desk/ floor/ box/ are for, and empty dirs that survive git.
# These are the ONLY paths under those three directories that may be public,
# which is why they are FILE entries and the directories are DENY below.
FILE desk/README.md
FILE desk/.gitkeep
FILE floor/README.md
FILE floor/.gitkeep
FILE box/README.md
FILE box/.gitkeep
FILE box/transcripts/ytfetch.py
FILE portals/.gitkeep
FILE circles/.gitkeep
FILE scrolls/.gitkeep

# ─── Denied: personal layer ──────────────────────────────────────
DENY AGENTS.md
DENY mage_seal.md

# ─── Denied: live config if rewritten under system/ ──────────────
# Live instance files moved to desk/config/ (2026-08-30). desk/ is DENY
# wholesale. These four remain so a live file accidentally recreated under
# the allowed system/ DIR cannot ship.
DENY system/config/connections.md
DENY system/config/private_names.txt
DENY system/config/sanitize_exceptions.txt
DENY system/config/declared_listeners.txt
DENY system/tomes/librarian/

# ─── Denied: lore awaiting a publication decision ────────────────
# `library/` is allowed wholesale, so a scroll held back needs a line here or
# it ships on the next run. The text carries no names and passes sanitation —
# what is being held is not the wording, it is the decision, and the decision
# belongs to more than one person. Recording it in a commit message would have
# been a rule going unread: the next publish reads this file, not the log.
# Remove the line when the answer is yes. Held 2026-08-10.
DENY library/resonance/romantic-partnership/lore/on_the_unopposed_account.md

# ─── Denied: private practice memory ─────────────────────────────
# The whole of the practice record. The handful of scaffolding files that DO
# ship from inside these directories are FILE entries above and win by
# precedence; everything else here is unreachable.
DENY desk/
DENY floor/
DENY box/
DENY circles/
DENY portals/
DENY universe/
DENY scrolls/

# Live registries carry real people. Only the .template siblings ship — and
# they do, via FILE entries above. The public repo carried both live files from
# before this rule existed (sanitized to [redacted-*], but accumulation rather
# than intent); the 2026-08-07 publish pruned them along with `archive/`, the
# first run where the public tree was a derivation of this file.
DENY circles/registry.yaml
DENY portals/registry.yaml

# ─── Denied: archives and working debris ─────────────────────────
DENY archive/
DENY .trash/
DENY floor/research/backups/
DENY .reconcile-backups/
DENY .git-backup-pre-filter/
DENY .publish-worktree/

# ─── Denied: editor, OS, runtime noise ───────────────────────────
DENY .DS_Store
DENY .obsidian/
DENY .vscode/
DENY .history/
DENY __pycache__/
DENY *.lock
